name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f")
            cp "$f" "out/AudioLinkPlayer-${base#app-}"
          done
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioLinkPlayer-APK
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: AudioLinkPlayer v2.0.${{ github.run_number }}
          body: |
            后台播放版。装 **arm64-v8a** 那个（几乎所有 2018 年后的手机都是）；
            老机器装 armeabi-v7a；不确定就装 universal。

            - 粘贴链接 → 直接流式播放，不下载到手机
            - 息屏 / 退出 App 后音频继续播放
            - 多条链接排队、倍速、列表循环 / 单曲循环、清晰度切换
            - 解析内核 yt-dlp，支持上千站点，可在设置里一键更新
          files: out/*.apk
